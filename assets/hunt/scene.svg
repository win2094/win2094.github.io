<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" shape-rendering="crispEdges" role="img" aria-label="Pixel dragon arena">
  <rect width="320" height="180" fill="#000"/>
  <!-- sky stars -->
  <g fill="#fff">
    <rect x="16" y="10" width="2" height="2"/><rect x="48" y="22" width="2" height="2" fill="#9a9a9a"/>
    <rect x="90" y="8" width="2" height="2"/><rect x="140" y="18" width="2" height="2" fill="#9a9a9a"/>
    <rect x="200" y="12" width="2" height="2"/><rect x="260" y="20" width="2" height="2" fill="#9a9a9a"/>
    <rect x="300" y="8" width="2" height="2"/>
  </g>
  <!-- mountains -->
  <path d="M0 110 L40 70 L80 100 L120 55 L170 95 L220 60 L280 90 L320 75 L320 180 L0 180 Z" fill="#1a1a1a"/>
  <path d="M0 130 L60 95 L110 125 L160 85 L230 120 L320 100 L320 180 L0 180 Z" fill="#2a2a2a"/>
  <!-- arena ring -->
  <ellipse cx="160" cy="148" rx="110" ry="22" fill="#111" stroke="#fff" stroke-width="3"/>
  <ellipse cx="160" cy="148" rx="88" ry="14" fill="#000" stroke="#5a5a5a" stroke-width="2"/>
  <!-- dragon body -->
  <g fill="#fff">
    <rect x="118" y="78" width="84" height="28"/>
    <rect x="100" y="86" width="22" height="16"/>
    <rect x="198" y="84" width="36" height="18"/>
    <rect x="228" y="76" width="22" height="14"/>
    <rect x="244" y="68" width="14" height="12"/>
    <!-- wings -->
    <rect x="130" y="58" width="28" height="24"/>
    <rect x="162" y="52" width="34" height="28"/>
    <rect x="120" y="48" width="16" height="16" fill="#9a9a9a"/>
    <rect x="188" y="44" width="18" height="18" fill="#9a9a9a"/>
    <!-- legs -->
    <rect x="128" y="104" width="10" height="18"/>
    <rect x="148" y="104" width="10" height="18"/>
    <rect x="168" y="104" width="10" height="18"/>
    <rect x="188" y="104" width="10" height="16"/>
    <!-- horns -->
    <rect x="248" y="56" width="6" height="14"/>
    <rect x="258" y="58" width="6" height="12"/>
  </g>
  <g fill="#000">
    <rect x="250" y="80" width="6" height="6"/>
    <rect x="136" y="86" width="8" height="6"/>
    <rect x="172" y="86" width="10" height="6"/>
  </g>
  <!-- hunter -->
  <g fill="#fff">
    <rect x="70" y="118" width="10" height="18"/>
    <rect x="68" y="112" width="14" height="8"/>
    <rect x="72" y="136" width="6" height="8"/>
    <rect x="78" y="120" width="16" height="4"/>
  </g>
  <rect x="90" y="116" width="4" height="18" fill="#9a9a9a"/>
  <!-- label bar -->
  <rect x="12" y="158" width="110" height="14" fill="#fff"/>
  <text x="18" y="169" fill="#000" font-family="monospace" font-size="10" font-weight="700">HUNT · ARENA</text>
</svg>
